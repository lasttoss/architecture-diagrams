name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Every diagram in README.md has a mermaid source next to it
        run: node scripts/check-diagrams.mjs
